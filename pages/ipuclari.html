<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finansal İpuçları – BudgetBuddy</title>
  <link rel="stylesheet" href="/cerenyurduseven-budgetbuddy/assets/css/style.css?v=15" />
  <link rel="icon" href="/cerenyurduseven-budgetbuddy/assets/img/favicon.png" type="image/png" />
  <style>
    .ipucu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }
    .ipucu-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      position: relative;
      transition: all .25s ease;
      cursor: pointer;
    }
    .ipucu-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      border-color: var(--card-color, var(--green));
    }
    .ipucu-card .card-color-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 14px 14px 0 0;
      background: var(--card-color, var(--green));
    }
    .ipucu-icon {
      font-size: 2.2rem;
      margin-bottom: 12px;
      display: block;
    }
    .ipucu-baslik {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 8px;
      color: var(--text-1);
    }
    .ipucu-aciklama {
      font-size: .85rem;
      color: var(--text-2);
      line-height: 1.6;
      margin-bottom: 14px;
    }
    .ipucu-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge-kategori {
      font-size: .72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--bg-3);
      color: var(--text-2);
    }
    .badge-zorluk {
      font-size: .72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 99px;
    }
    .badge-zorluk.Kolay  { background: rgba(34,197,94,.15);  color: #22c55e; }
    .badge-zorluk.Orta   { background: rgba(245,158,11,.15); color: #f59e0b; }
    .badge-zorluk.Zor    { background: rgba(239,68,68,.15);  color: #ef4444; }
    .fav-btn {
      position: absolute;
      top: 14px; right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.3rem;
      transition: transform .2s;
      line-height: 1;
    }
    .fav-btn:hover { transform: scale(1.3); }
    .fav-btn.active { filter: drop-shadow(0 0 4px rgba(239,68,68,.6)); }
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .filter-btn {
      padding: 6px 16px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg-2);
      color: var(--text-2);
      cursor: pointer;
      font-size: .8rem;
      font-weight: 600;
      transition: all .2s;
      font-family: inherit;
    }
    .filter-btn:hover,
    .filter-btn.active {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }
    .empty-fav {
      text-align: center;
      padding: 40px;
      color: var(--text-3);
    }
    .fav-count-badge {
      background: var(--red);
      color: #fff;
      font-size: .65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 99px;
      margin-left: 6px;
    }
    .search-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .search-wrap input {
      padding-left: 36px;
      width: 100%;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
    }
    @media (max-width: 768px) {
      .ipucu-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menüyü aç/kapat">
  <div class="bars"><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">💰</div><span>BudgetBuddy</span></div>
        <nav class="sidebar-nav">
      <span class="nav-section-title">Genel</span>
      <a class="nav-link" href="/cerenyurduseven-budgetbuddy/index.html"><i data-lucide="layout-dashboard"></i> Panel</a>
      <a class="nav-link" href="project.html"><i data-lucide="list"></i> İşlemler</a>
      <a class="nav-link" href="ipuclari.html" class="nav-link active" style="position:relative;">
        <i data-lucide="lightbulb"></i> İpuçları
        <span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:#f97316;color:#fff;font-size:.65rem;padding:2px 7px;border-radius:99px;font-weight:700;">YENİ</span>
      </a>
      <a class="nav-link" href="raporlar.html" style="position:relative;">
        <i data-lucide="bar-chart-2"></i> Raporlar
        <span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--green);color:#fff;font-size:.65rem;padding:2px 7px;border-radius:99px;font-weight:700;">YENİ</span>
      </a>
      <span class="nav-section-title">Hesap</span>
      <a class="nav-link" href="about.html"><i data-lucide="user"></i> Profilim</a>
      <a class="nav-link" href="contact.html"><i data-lucide="mail"></i> Destek</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card" id="logoutBtn">
        <div class="user-avatar" id="userInitials">--</div>
        <div class="user-info">
          <div class="user-name" id="userName">Yükleniyor...</div>
          <div class="user-email" id="userEmail"></div>
        </div>
        <i data-lucide="log-out" style="opacity:.4;flex-shrink:0;"></i>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">💡 Finansal İpuçları</h1>
        <p class="page-subtitle">JSON'dan okunan veriler — favorilerinizi kaydedin</p>
      </div>
    </div>

    <!-- Tabs: Tümü / Favorilerim -->
    <div style="display:flex;gap:4px;background:var(--bg-2);border-radius:10px;padding:4px;border:1px solid var(--border);width:fit-content;margin-bottom:20px;">
      <button class="tab-btn-custom active" id="tabTumu" onclick="switchTab('tumu')">📚 Tümü</button>
      <button class="tab-btn-custom" id="tabFav" onclick="switchTab('favori')">❤️ Favorilerim <span class="fav-count-badge" id="favCount">0</span></button>
    </div>

    <!-- Arama -->
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="form-control" type="text" id="searchInput" placeholder="İpucu ara..." />
    </div>

    <!-- Kategori Filtreleri -->
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-kat="Tümü">Tümü</button>
    </div>

    <!-- Kart Listesi -->
    <div class="ipucu-grid" id="ipucuGrid">
      <div style="text-align:center;padding:40px;color:var(--text-3);">⏳ Yükleniyor...</div>
    </div>
  </main>
</div>

<div id="toast-container"></div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="/cerenyurduseven-budgetbuddy/assets/js/main.js?v=15"></script>
<script>
// Tab stilleri
document.querySelectorAll('.tab-btn-custom').forEach(btn => {
  btn.style.cssText = 'padding:8px 16px;border-radius:8px;border:none;background:none;color:var(--text-3);cursor:pointer;font-family:inherit;font-size:.875rem;font-weight:500;transition:all .2s;';
});
document.getElementById('tabTumu').style.background = 'var(--green)';
document.getElementById('tabTumu').style.color = '#fff';

let tumIpuclari = [];
let mevcutTab = 'tumu';
let mevcutKat = 'Tümü';
let aramaMetni = '';

// ── Favoriler ────────────────────────────────
function getFavs() { return DB.get('bb_favoriler_' + (DB.get('bb_session')?.user?.id || 'demo'), []); }
function setFavs(favs) { DB.set('bb_favoriler_' + (DB.get('bb_session')?.user?.id || 'demo'), favs); }
function isFav(id) { return getFavs().includes(id); }
function toggleFav(id) {
  let favs = getFavs();
  if (favs.includes(id)) {
    favs = favs.filter(f => f !== id);
    Toast.info('Favorilerden çıkarıldı');
  } else {
    favs.push(id);
    Toast.success('Favorilere eklendi! ❤️');
  }
  setFavs(favs);
  updateFavCount();
  renderCards();
}

function updateFavCount() {
  const count = getFavs().length;
  document.getElementById('favCount').textContent = count;
  document.getElementById('favCount').style.display = count > 0 ? 'inline' : 'none';
}

// ── Render Kartlar ───────────────────────────
function renderCards() {
  let data = [...tumIpuclari];

  // Tab filtresi
  if (mevcutTab === 'favori') {
    const favs = getFavs();
    data = data.filter(i => favs.includes(i.id));
  }

  // Kategori filtresi
  if (mevcutKat !== 'Tümü') {
    data = data.filter(i => i.kategori === mevcutKat);
  }

  // Arama filtresi
  if (aramaMetni) {
    const q = aramaMetni.toLowerCase();
    data = data.filter(i =>
      i.baslik.toLowerCase().includes(q) ||
      i.aciklama.toLowerCase().includes(q) ||
      i.kategori.toLowerCase().includes(q)
    );
  }

  const grid = document.getElementById('ipucuGrid');

  if (!data.length) {
    grid.innerHTML = `<div class="empty-fav"><div style="font-size:3rem;margin-bottom:12px;">${mevcutTab === 'favori' ? '💔' : '🔍'}</div><p>${mevcutTab === 'favori' ? 'Henüz favori eklemediniz.' : 'Sonuç bulunamadı.'}</p></div>`;
    return;
  }

  grid.innerHTML = data.map(ip => `
    <div class="ipucu-card" style="--card-color:${ip.renk};">
      <div class="card-color-bar"></div>
      <button class="fav-btn ${isFav(ip.id) ? 'active' : ''}" onclick="toggleFav(${ip.id})" title="${isFav(ip.id) ? 'Favoriden çıkar' : 'Favorilere ekle'}">
        ${isFav(ip.id) ? '❤️' : '🤍'}
      </button>
      <span class="ipucu-icon">${ip.icon}</span>
      <div class="ipucu-baslik">${ip.baslik}</div>
      <div class="ipucu-aciklama">${ip.aciklama}</div>
      <div class="ipucu-footer">
        <span class="badge-kategori">${ip.kategori}</span>
        <span class="badge-zorluk ${ip.zorluk}">${ip.zorluk}</span>
      </div>
    </div>
  `).join('');
}

// ── Tab Değiştir ─────────────────────────────
function switchTab(tab) {
  mevcutTab = tab;
  document.querySelectorAll('.tab-btn-custom').forEach(btn => {
    btn.style.background = 'none';
    btn.style.color = 'var(--text-3)';
  });
  const activeBtn = tab === 'tumu' ? document.getElementById('tabTumu') : document.getElementById('tabFav');
  activeBtn.style.background = 'var(--green)';
  activeBtn.style.color = '#fff';
  renderCards();
}

// ── Kategori Filtresi ────────────────────────
function buildFilters() {
  const kategoriler = ['Tümü', ...new Set(tumIpuclari.map(i => i.kategori))];
  const bar = document.getElementById('filterBar');
  bar.innerHTML = kategoriler.map(kat => `
    <button class="filter-btn ${kat === 'Tümü' ? 'active' : ''}" data-kat="${kat}" onclick="filterByKat('${kat}')">${kat}</button>
  `).join('');
}

function filterByKat(kat) {
  mevcutKat = kat;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.kat === kat);
  });
  renderCards();
}

// ── Arama ────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', function() {
  aramaMetni = this.value;
  renderCards();
});

// ── JSON'dan Veri Yükle ──────────────────────
(async () => {
  try { await Auth.ben(); } catch { window.location.href = '/cerenyurduseven-budgetbuddy/pages/giris.html'; return; }

  try {
    const res = await fetch('/cerenyurduseven-budgetbuddy/assets/data/ipuclari.json');
    const data = await res.json();
    tumIpuclari = data.ipuclari;
    buildFilters();
    updateFavCount();
    renderCards();
  } catch(e) {
    document.getElementById('ipucuGrid').innerHTML = '<div style="text-align:center;padding:40px;color:var(--red);">❌ Veriler yüklenemedi.</div>';
  }

  lucide.createIcons();
})();
</script>
</body>
</html>
